name: Check news publication

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test news checks
        run: npm run test:news
      - name: Validate archive, new publication day and shared quota against fresh main
        run: npm run validate:news:publication
