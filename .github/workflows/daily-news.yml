name: Collect daily 3C news candidates

on:
  schedule:
    # 02:15 Asia/Taipei (UTC+8). GitHub Actions schedules use UTC.
    - cron: "15 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-news-update
  cancel-in-progress: false

jobs:
  collect-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test news checks
        run: npm run test:news
      - name: Validate published archive
        run: npm run validate:news
      - name: Collect unreviewed source candidates
        run: node scripts/update-news.mjs
      - name: Preserve candidates for editorial review
        uses: actions/upload-artifact@v4
        with:
          name: news-candidates-${{ github.run_id }}
          path: work/news-candidates.json
          retention-days: 7
          if-no-files-found: error
