name: Update daily 3C news

on:
  schedule:
    # 02:15 Asia/Taipei (UTC+8). GitHub Actions schedules use UTC.
    - cron: "15 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-news-update
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test news validator
        run: node --test scripts/validate-news.test.mjs
      - name: Append verified articles
        run: node scripts/update-news.mjs
      - name: Validate news data
        id: validate-news
        run: node scripts/validate-news.mjs
      - name: Commit and push when news changed
        if: ${{ success() && steps.validate-news.outcome == 'success' }}
        run: |
          if git diff --quiet -- content/news.json; then exit 0; fi
          git config user.name "second-phone-king-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/news.json
          git commit -m "chore(news): update daily 3C news"
          git push
